name: Wrong record
description: A document in the directory has wrong or missing metadata, or a wrong summary.
title: "Wrong record: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for flagging it. The summary, key insights, tags and places are generated by AI, so
        corrections to those are especially useful.
  - type: input
    id: record
    attributes:
      label: Record id or URL
      description: For example `saiia-001296` or `https://climateinsightsdirectory.org/document/saiia-001296`.
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: What is wrong
      multiple: true
      options:
        - Title
        - Publisher or authors
        - Publication date
        - Language
        - Document type
        - Summary or key insights
        - Climate tags
        - Places (geography)
        - Link to the original
        - Duplicate of another record
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What it says now, and what it should say
      description: Quote the original document or link it, with a page number if you can.
    validations:
      required: true
